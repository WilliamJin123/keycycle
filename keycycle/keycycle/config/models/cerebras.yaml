# Cerebras free-tier (Free Trial) rate limits.
# Source: https://inference-docs.cerebras.ai/models/overview
#         https://inference-docs.cerebras.ai/support/rate-limits
# Verified 2026-09-07: the Cerebras public Model Catalog now lists only two
# models available on the Free Trial tier — gpt-oss-120b and qwen-3.8-27b.
# All other entries previously listed here (llama3.1-8b, llama-3.3-70b,
# qwen-3-32b, qwen-3-235b-a22b-instruct-2507, zai-glm-4.7) have been removed
# from the public catalog and can no longer be served on free keys.
# Cerebras no longer publishes separate requests_per_hour/requests_per_day
# caps for this tier (only requests_per_minute plus token buckets), so those
# two fields below are derived as a sustained-RPM bound (rpm * 60, rpm * 60 * 24)
# rather than an independently-enforced Cerebras limit. tokens_per_minute uses
# the "uncached TPM" figure, the primary/binding token bucket per Cerebras docs.
gpt-oss-120b:
  requests_per_minute: 5
  requests_per_hour: 300
  requests_per_day: 7200
  tokens_per_minute: 30000
  tokens_per_hour: 1000000
  tokens_per_day: 1000000

qwen-3.8-27b:
  requests_per_minute: 5
  requests_per_hour: 300
  requests_per_day: 7200
  tokens_per_minute: 30000
  tokens_per_hour: 1000000
  tokens_per_day: 1000000

default:
  requests_per_minute: 5
  requests_per_hour: 300
  requests_per_day: 7200
  tokens_per_minute: 30000
  tokens_per_hour: 1000000
  tokens_per_day: 1000000
